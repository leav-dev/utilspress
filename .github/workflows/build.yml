name: Build utilspress

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            build_cmd: flet build linux
            artifact_name: utilspress-linux
            artifact_path: build/linux
            needs_linux_deps: true

          - name: macOS
            runner: macos-latest
            build_cmd: flet build macos
            artifact_name: utilspress-macos
            artifact_path: build/macos
            needs_linux_deps: false

          - name: Windows
            runner: windows-latest
            build_cmd: flet build windows
            artifact_name: utilspress-windows
            artifact_path: build/windows
            needs_linux_deps: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          LINUX_DEPS="$(uv run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          sudo apt-get clean

      - name: Build app
        shell: bash
        run: |
          uv run ${{ matrix.build_cmd }} --yes --verbose

      - name: Package Linux (.run)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y makeself
          makeself "${{ matrix.artifact_path }}" "${{ matrix.artifact_name }}.run" \
            "utilspress — Image and PDF processor" \
            ./utilspress

      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname "utilspress" \
            -srcfolder "${{ matrix.artifact_path }}" \
            -ov -format UDZO \
            "${{ matrix.artifact_name }}.dmg"

      - name: Package Windows (.exe)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          7z a -sfx ${{ matrix.artifact_name }}.exe ${{ matrix.artifact_path }}\*

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
