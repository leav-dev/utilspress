name: Build utilspress

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            build_cmd: flet build linux
            artifact_name: utilspress-linux
            artifact_path: build/linux
            needs_linux_deps: true

          # - name: macOS
          #   runner: macos-latest
          #   build_cmd: flet build macos
          #   artifact_name: utilspress-macos
          #   artifact_path: build/macos
          #   needs_linux_deps: false

          - name: Windows
            runner: windows-latest
            # Un solo .exe: `flet pack` (PyInstaller) es onefile por defecto;
            # NO pasar -D/--onedir. Requiere el paquete `pyinstaller`
            # (ver dependencias en pyproject.toml).
            build_cmd: flet pack src/main.py --name utilspress
            artifact_name: utilspress-windows
            artifact_path: dist/utilspress.exe
            needs_linux_deps: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          LINUX_DEPS="$(uv run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          sudo apt-get clean

      - name: Build app
        shell: bash
        run: |
          uv run ${{ matrix.build_cmd }} --yes --verbose

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # AppDir desde la salida de `flet build linux` (binario utilspress + lib/ + data/)
          mkdir -p AppDir
          cp -r "${{ matrix.artifact_path }}"/* AppDir/
          chmod +x AppDir/utilspress
          # Desktop entry — Terminal=false evita abrir terminal
          cat > AppDir/utilspress.desktop << 'DESKTOP_EOF'
          [Desktop Entry]
          Name=utilspress
          Comment=Image and PDF processor
          Exec=utilspress
          Icon=utilspress
          Type=Application
          Categories=Graphics;
          Terminal=false
          DESKTOP_EOF
          # Generate a minimal icon (pure Python, no deps)
          python3 -c "
          import struct, zlib
          w, h = 256, 256
          raw = b''
          for y in range(h):
              raw += b'\x00' + b''.join(struct.pack('BBBB', 64, 128, 255, 255) for _ in range(w))
          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          ihdr = struct.pack('>IIBBBBB', w, h, 8, 6, 0, 0, 0)
          idat = zlib.compress(raw)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')
          with open('AppDir/utilspress.png', 'wb') as f:
              f.write(png)
          "
          # linuxdeploy + plugin GTK (bundlea GTK/mpv/secret/gstreamer)
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage" -O linuxdeploy-x86_64.AppImage
          wget -q "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh" -O linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          # Extraer linuxdeploy para no necesitar FUSE en CI
          ./linuxdeploy-x86_64.AppImage --appimage-extract > /dev/null 2>&1
          # Sin AppRun propio: linuxdeploy genera el suyo con LD_LIBRARY_PATH y schemas
          ./squashfs-root/AppRun --appdir AppDir -e AppDir/utilspress -d AppDir/utilspress.desktop -i AppDir/utilspress.png --plugin gtk --output appimage
          mv utilspress-*.AppImage "${{ matrix.artifact_name }}.AppImage"
          chmod +r "${{ matrix.artifact_name }}.AppImage"
          # Fallback cero-FUSE: tarball con el contenido de build/linux
          tar -czf "${{ matrix.artifact_name }}.tar.gz" -C "${{ matrix.artifact_path }}" .

      # - name: Package macOS (.dmg)
      #   if: runner.os == 'macOS'
      #   shell: bash
      #   run: |
      #     hdiutil create -volname "utilspress" \
      #       -srcfolder "${{ matrix.artifact_path }}" \
      #       -ov -format UDZO \
      #       "${{ matrix.artifact_name }}.dmg"

      - name: Package Windows (single exe)
        # `flet pack` ya deja dist/utilspress.exe (onefile); se copia a la
        # raiz con el nombre del artefacto para que el paso de upload
        # (compartido con Linux) no se toque.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.artifact_path }}" -Destination "${{ matrix.artifact_name }}.exe"
          Get-ChildItem "${{ matrix.artifact_name }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
