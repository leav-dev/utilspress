name: Build utilspress

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  UV_PYTHON: 3.12
  PYTHONUTF8: 1
  FLET_CLI_NO_RICH_OUTPUT: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            build_cmd: flet build linux
            artifact_name: utilspress-linux
            artifact_path: build/linux
            needs_linux_deps: true

          - name: macOS
            runner: macos-latest
            build_cmd: flet build macos
            artifact_name: utilspress-macos
            artifact_path: build/macos
            needs_linux_deps: false

          - name: Windows
            runner: windows-latest
            build_cmd: flet build windows
            artifact_name: utilspress-windows
            artifact_path: build/windows
            needs_linux_deps: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Linux dependencies
        if: matrix.needs_linux_deps
        shell: bash
        run: |
          sudo apt update --allow-releaseinfo-change
          LINUX_DEPS="$(uv run python -c 'from flet.utils.linux_deps import linux_dependencies; print(" ".join(linux_dependencies))')"
          sudo apt-get install -y --no-install-recommends $LINUX_DEPS
          sudo apt-get clean

      - name: Build app
        shell: bash
        run: |
          uv run ${{ matrix.build_cmd }} --yes --verbose

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Prepare AppDir structure
          mkdir -p AppDir
          cp -r "${{ matrix.artifact_path }}"/* AppDir/
          chmod +x AppDir/utilspress
          # Desktop entry — Terminal=false evita abrir terminal
          cat > AppDir/utilspress.desktop << 'DESKTOP_EOF'
          [Desktop Entry]
          Name=utilspress
          Comment=Image and PDF processor
          Exec=utilspress
          Icon=utilspress
          Type=Application
          Categories=Graphics;
          Terminal=false
          DESKTOP_EOF
          # AppRun wrapper
          cat > AppDir/AppRun << 'APPRUN_EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/utilspress" "$@"
          APPRUN_EOF
          chmod +x AppDir/AppRun
          # Generate a minimal icon
          python3 -c "
          from PIL import Image
          img = Image.new('RGBA', (256, 256), (64, 128, 255, 255))
          img.save('AppDir/utilspress.png')
          "
          # Download appimagetool
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          # Extract to avoid FUSE
          ./appimagetool --appimage-extract > /dev/null 2>&1
          # Create AppImage
          ./squashfs-root/AppRun --no-appstream AppDir "${{ matrix.artifact_name }}.AppImage"
          chmod +r "${{ matrix.artifact_name }}.AppImage"

      - name: Package macOS (.dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -volname "utilspress" \
            -srcfolder "${{ matrix.artifact_path }}" \
            -ov -format UDZO \
            "${{ matrix.artifact_name }}.dmg"

      - name: Package Windows (.exe)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          7z a -sfx ${{ matrix.artifact_name }}.exe ${{ matrix.artifact_path }}\*

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
