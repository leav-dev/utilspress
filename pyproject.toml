[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "utilspress"
version = "2.0"
description = "Procesamiento de imágenes con GUI de escritorio"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "flet>=0.28",
    "PyMuPDF",
    # Requerido por `flet pack` (flet-cli no lo instala solo): genera el .exe
    # unico de Windows (verificado: sin el, pack falla con
    # "Please install PyInstaller module to use flet pack command").
    "pyinstaller",
]

[project.scripts]
utilspress = "src.main:entry_point"
utilspress-cli = "src.cli:main"

[tool.flet.app]
path = "src"
module = "main"
